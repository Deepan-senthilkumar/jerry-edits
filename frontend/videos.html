<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry-Edits - All Videos</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="videos.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css'
        integrity='sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ=='
        crossorigin='anonymous' />
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="page-title-section">
        <span>Collection</span>
        <h2>All Videos</h2>
    </section>

    <!-- Loading Message -->
    <div id="loading" style="text-align:center; padding: 40px; font-size: 18px;">
        Loading videos...
    </div>

    <!-- Videos Grid -->
    <section id="videos-section" class="videos-grid"></section>

    <!-- Load More Button -->
    <div class="load-more-wrapper">
        <button id="load-more-btn" class="load-more-btn" style="display:none;" onclick="renderBatch()">
            Load More Videos
        </button>
    </div>

    <div id="footer-placeholder"></div>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>

    <script>
        // Replace thumbnail card with embedded iframe on click
        function loadVideo(card, videoId) {
            card.innerHTML = `
                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
                    title="YouTube video"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            `;
        }

        let allVideos = [];   // all videos from the API
        let shownCount = 0;   // how many are currently rendered

        // Returns per-batch limit based on current screen width
        // Desktop (>1024px): 21 | Tablet (601–1024px): 20 | Mobile (≤600px): 10
        function getLimit() {
            if (window.innerWidth <= 600) return 10;
            if (window.innerWidth <= 1024) return 20;
            return 21;
        }

        function formatViews(views) {
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'k';
            return views;
        }

        function createCard(video) {
            const card = document.createElement('div');
            card.classList.add('video-card');
            card.setAttribute('onclick', `loadVideo(this, '${video.videoId}')`);
            card.innerHTML = `
                <div class="video-thumb-wrap">
                    <img
                        src="https://img.youtube.com/vi/${video.videoId}/mqdefault.jpg"
                        alt="${video.title}"
                        loading="lazy">
                    <div class="play-btn-overlay">
                        <div class="play-btn-circle">
                            <svg viewBox="0 0 24 24" fill="white" width="32" height="32">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <p class="video-title">${video.title}</p>
                <p class="video-views">👁️ ${formatViews(video.views)} views</p>
            `;
            return card;
        }

        function renderBatch() {
            const section = document.getElementById('videos-section');
            const limit = getLimit();
            const batch = allVideos.slice(shownCount, shownCount + limit);

            batch.forEach(video => {
                section.appendChild(createCard(video));
            });

            shownCount += batch.length;

            // Show or hide the "Load More" button
            const btn = document.getElementById('load-more-btn');
            if (shownCount >= allVideos.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        fetch('https://jerry-edits-backend.onrender.com/api/videos/by-views')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                allVideos = data.data;
                renderBatch(); // show first batch
            })
            .catch(err => {
                console.error('Videos error:', err);
                document.getElementById('loading').innerText =
                    'Failed to load videos. Please try again later.';
            });
    </script>
</body>
</html>
