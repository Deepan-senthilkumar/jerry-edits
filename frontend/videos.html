<body>
    <div id="header-placeholder"></div>

    <section class="section-4" id="section-4">
        <div>
            <div class="left">
                <img class="logo" src="images/logo.jpg" alt="Jerry-Edits logo">
                <div class="font">
                    <p>Jerry-Edits</p>
                    <a href="https://www.youtube.com/@jerryedits4" target="_blank" rel="noopener noreferrer">
                        <button class="button1"><i class="fa-brands fa-youtube"></i> Subscribe</button>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <section class="page-title-section">
        <span>Collection</span>
        <h1>All Videos</h1>
    </section>

    <!-- Loading Message -->
    <div id="loading" style="text-align:center; padding: 30px; font-size: 18px;">
        Loading videos...
    </div>

    <!-- Videos Grid -->
    <section id="videos-section" class="videos-grid"></section>

    <!-- Load More Button -->
    <div class="load-more-wrapper">
        <button id="load-more-btn" class="load-more-btn" style="display:none;" onclick="renderBatch()">
            Load More Videos
        </button>
    </div>

    <div id="footer-placeholder"></div>
    <script src="js/config.js"></script>
    <script src="js/fallbackVideos.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>

    <script>
        // Replace thumbnail card with embedded iframe on click
        function loadVideo(card, videoId) {
            card.innerHTML = `
                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
                    title="YouTube video"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            `;
        }

        let allVideos = [];   // all videos from the API or cache
        let shownCount = 0;   // how many are currently rendered

        function getLimit() {
            if (window.innerWidth <= 600) return 10;
            if (window.innerWidth <= 1024) return 20;
            return 21;
        }

        function formatViews(views) {
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'k';
            return views;
        }

        function createCard(video) {
            const card = document.createElement('div');
            card.classList.add('video-card');
            card.setAttribute('onclick', `loadVideo(this, '${video.videoId}')`);
            card.innerHTML = `
                <div class="video-thumb-wrap">
                    <img
                        src="${video.thumbnail || `https://img.youtube.com/vi/${video.videoId}/mqdefault.jpg`}"
                        alt="${video.title}"
                        loading="lazy">
                    <div class="play-btn-overlay">
                        <div class="play-btn-circle">
                            <svg viewBox="0 0 24 24" fill="white" width="26" height="26">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <p class="video-title">${video.title}</p>
                <p class="video-views">👁️ ${formatViews(video.views)} views</p>
            `;
            return card;
        }

        function renderBatch() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';

            const section = document.getElementById('videos-section');
            const limit = getLimit();
            const batch = allVideos.slice(shownCount, shownCount + limit);

            batch.forEach(video => {
                section.appendChild(createCard(video));
            });

            shownCount += batch.length;

            const btn = document.getElementById('load-more-btn');
            if (shownCount >= allVideos.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        // STEP 1: Instant render from localStorage or fallback
        const cached = localStorage.getItem('jerry_videos_cache');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length) {
                    allVideos = parsed;
                    renderBatch();
                }
            } catch (e) {}
        }

        // Fallback if localStorage was empty (0ms latency!)
        if (allVideos.length === 0 && typeof FALLBACK_VIDEOS !== 'undefined' && FALLBACK_VIDEOS.length) {
            allVideos = FALLBACK_VIDEOS;
            renderBatch();
        }

        // STEP 2: Background revalidation from Render API
        fetch(`${CONFIG.API_BASE_URL}/api/videos/by-views`)
            .then(res => res.json())
            .then(data => {
                if (data && data.data && data.data.length) {
                    const isFirstRender = (allVideos.length === 0);
                    allVideos = data.data;
                    localStorage.setItem('jerry_videos_cache', JSON.stringify(data.data));

                    if (isFirstRender) {
                        renderBatch();
                    }
                }
            })
            .catch(err => {
                console.warn('Backend fetch delayed/failed:', err);
                if (allVideos.length === 0) {
                    document.getElementById('loading').innerText =
                        'Failed to load videos from server. Please refresh or visit @jerryedits4 on YouTube.';
                }
            });
    </script>
</body>
</html>
