    <script>
        // Replace thumbnail card with embedded iframe on click
        function loadVideo(card, videoId) {
            card.innerHTML = `
                <iframe
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
                    title="YouTube video"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            `;
        }

        let allVideos = [];       // all videos from the API or cache
        let shownCount = 0;       // how many are currently rendered
        let currentFilter = 'all'; // active category filter

        function filterCategory(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const section = document.getElementById('videos-section');
            section.innerHTML = '';
            shownCount = 0;
            renderBatch();
        }

        function getFilteredVideos() {
            if (currentFilter === 'all') return allVideos;
            const cat = currentFilter.toLowerCase();
            return allVideos.filter(v => {
                const title = (v.title || '').toLowerCase();
                if (cat === 'love') return title.includes('love') || title.includes('kadhal') || title.includes('kadhale') || title.includes('uyire') || title.includes('romantic') || title.includes('neeyadi') || title.includes('mazhai');
                if (cat === 'friendship') return title.includes('friend') || title.includes('natpu') || title.includes('othayilae') || title.includes('dhanush');
                if (cat === 'bgm') return title.includes('bgm') || title.includes('song') || title.includes('massup') || title.includes('mix') || title.includes('tune');
                if (cat === 'mass') return title.includes('mass') || title.includes('attitude') || title.includes('vijay') || title.includes('ajith') || title.includes('dhanush') || title.includes('thunivu');
                return true;
            });
        }

        function getLimit() {
            if (window.innerWidth <= 600) return 10;
            if (window.innerWidth <= 1024) return 20;
            return 21;
        }

        function formatViews(views) {
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'k';
            return views;
        }

        function createCard(video) {
            const card = document.createElement('div');
            card.classList.add('video-card');
            card.setAttribute('onclick', `loadVideo(this, '${video.videoId}')`);
            card.innerHTML = `
                <div class="video-thumb-wrap">
                    <img
                        src="${video.thumbnail || `https://img.youtube.com/vi/${video.videoId}/mqdefault.jpg`}"
                        alt="${video.title}"
                        loading="lazy">
                    <div class="play-btn-overlay">
                        <div class="play-btn-circle">
                            <svg viewBox="0 0 24 24" fill="white" width="26" height="26">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <p class="video-title">${video.title}</p>
                <p class="video-views">👁️ ${formatViews(video.views)} views</p>
            `;
            return card;
        }

        function renderBatch() {
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';

            const section = document.getElementById('videos-section');
            const limit = getLimit();
            const filtered = getFilteredVideos();
            const batch = filtered.slice(shownCount, shownCount + limit);

            batch.forEach(video => {
                section.appendChild(createCard(video));
            });

            shownCount += batch.length;

            const btn = document.getElementById('load-more-btn');
            if (shownCount >= filtered.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        // STEP 1: Instant render from localStorage or fallback
        const cached = localStorage.getItem('jerry_videos_cache');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length) {
                    allVideos = parsed;
                    renderBatch();
                }
            } catch (e) {}
        }

        // Fallback if localStorage was empty (0ms latency!)
        if (allVideos.length === 0 && typeof FALLBACK_VIDEOS !== 'undefined' && FALLBACK_VIDEOS.length) {
            allVideos = FALLBACK_VIDEOS;
            renderBatch();
        }

        // STEP 2: Background revalidation from Render API
        fetch(`${CONFIG.API_BASE_URL}/api/videos/by-views`)
            .then(res => res.json())
            .then(data => {
                if (data && data.data && data.data.length) {
                    const isFirstRender = (allVideos.length === 0);
                    allVideos = data.data;
                    localStorage.setItem('jerry_videos_cache', JSON.stringify(data.data));

                    if (isFirstRender) {
                        renderBatch();
                    }
                }
            })
            .catch(err => {
                console.warn('Backend fetch delayed/failed:', err);
                if (allVideos.length === 0) {
                    document.getElementById('loading').innerText =
                        'Failed to load videos from server. Please refresh or visit @jerryedits4 on YouTube.';
                }
            });
    </script>
